<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Characters of Behind the Mask.">
  <link rel="icon" href="assets/img/logo-nav.webp">

          <h2>Secondary Routes</h2>

          <div class="grid" style="--min: 260px" data-char-grid="other"></div>
